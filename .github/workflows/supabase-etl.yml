name: Build and publish supabase-etl

on:
  push:
    branches: [main]
    tags: [supabase-etl-v*]
    paths:
      - postgres/supabase-etl/**
      - .github/workflows/supabase-etl.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: supabase-etl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: |
          version=$(grep '^version' postgres/supabase-etl/Cargo.toml | head -1 | cut -d'"' -f2)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rawtreedb/supabase-etl
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=supabase-etl-v(.*),group=1

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: postgres/supabase-etl
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
